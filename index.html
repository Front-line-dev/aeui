<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>AEUI Framework</title>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Framework & Plugin Definition (Normal JS) -->
    <script>
      console.log("AEUI Framework Loading...");

      /**
       * AEUI Framework Core
       */
      const AEUI = {
        _componentInstanceMap: new Map(),
        _containerElement: null,
        _RootComponent: null,
        _currentInstance: null,
        _isRendering: false,
        _previousVNode: null,

        createInstance(instanceKey, newVNode) {
          const instance = {
            vnode: newVNode,
            render: null,
            prevRenderedVNode: null,
            watchStates: [],
            cleanups: [],
            props: newVNode.props || {}, 
          };

          this._currentInstance = instance;
          // Setup runs once
          // Pass initial props to Setup
          instance.render = newVNode.tag(newVNode.props);
          this._currentInstance = null;

          return instance;
        },

        createVNode(tag, props, ...children) {
          // console.log("createVNode", tag, typeof tag);
          return { tag, props: props || {}, children: children.flat().filter(c => c != null) };
        },

        init(RootComponent, containerElement) {
          this._RootComponent = RootComponent;
          this._containerElement = containerElement;

          // Initial Render
          this._tick();

          // Start Loop (1s)
          setInterval(() => {
            this._tick();
          }, 1000);
        },

        _tick() {
          if (this._isRendering) return;
          this._isRendering = true;

          // 1. Run Watchers
          this._componentInstanceMap.forEach((instance) => {
            instance.watchStates.forEach((watcher) => {
              const newDeps = watcher.getDeps();
              const hasChanged =
                !watcher.oldDeps ||
                newDeps.some((d, i) => d !== watcher.oldDeps[i]);

              if (hasChanged) {
                watcher.callback();
                watcher.oldDeps = newDeps;
              }
            });
          });

          // 2. Reconcile
          const newVNode = this.createVNode(this._RootComponent);
          this._reconcile(
            this._containerElement,
            newVNode,
            this._previousVNode
          );
          this._previousVNode = newVNode;

          this._isRendering = false;
        },

        _createDomNode(vnode) {
          if (typeof vnode !== "object") {
            return document.createTextNode(String(vnode));
          }

          if (typeof vnode.tag !== "string") {
             console.error("_createDomNode: Invalid Tag", vnode.tag, typeof vnode.tag);
          }

          const domNode = document.createElement(vnode.tag);
          this._updateDomProps(domNode, vnode.props);

          // FIXED: Do not recursively create children here.
          // Let _reconcile handle them to support Components.

          return domNode;
        },

        _updateDomProps(domNode, props, oldProps = {}) {
          const allProps = { ...oldProps, ...props };

          for (const key in allProps) {
            const newValue = props ? props[key] : undefined;
            const oldValue = oldProps ? oldProps[key] : undefined;

            if (newValue === oldValue) continue;

            if (key.startsWith("on") && typeof newValue === "function") {
              const eventName = key.substring(2).toLowerCase();
              if (oldValue) domNode.removeEventListener(eventName, oldValue);
              if (newValue) domNode.addEventListener(eventName, newValue);
            } else if (key === "style" && typeof newValue === "string") {
              domNode.style.cssText = newValue;
            } else if (newValue === undefined) {
              domNode.removeAttribute(key);
            } else {
              domNode.setAttribute(key, newValue);
            }
          }
        },

        _unmount(instanceKey) {
          const instance = this._componentInstanceMap.get(instanceKey);
          if (instance) {
            instance.cleanups.forEach((cleanup) => cleanup());
            this._componentInstanceMap.delete(instanceKey);
          }
        },

        _reconcile(
          parentElement,
          newVNode,
          prevVNode,
          index = 0,
          instanceKey = "root"
        ) {
          // Debug Log
          // console.log("_reconcile", { tag: newVNode?.tag, type: typeof newVNode?.tag });

          // 1. Remove
          if (newVNode == null) {
            if (prevVNode) {
              this._unmount(instanceKey);
              if (parentElement.childNodes[index]) {
                parentElement.removeChild(parentElement.childNodes[index]);
              }
            }
            return;
          }

          // 2. Text Node (Primitive)
          if (typeof newVNode !== "object") {
            const domNode = parentElement.childNodes[index];
            if (domNode && domNode.nodeType === Node.TEXT_NODE) {
              if (domNode.nodeValue !== String(newVNode)) {
                domNode.nodeValue = String(newVNode);
              }
            } else {
              const newDomNode = document.createTextNode(String(newVNode));
              if (domNode) {
                parentElement.replaceChild(newDomNode, domNode);
              } else {
                parentElement.appendChild(newDomNode);
              }
            }
            return;
          }

          // 3. Component Node
          if (typeof newVNode.tag === "function") {
            let instance = this._componentInstanceMap.get(instanceKey);

            if (!instance) {
              instance = this.createInstance(instanceKey, newVNode);
              this._componentInstanceMap.set(instanceKey, instance);
            }

            // Render component
            this._currentInstance = instance;
            
            // PASS PROPS TO RENDER FUNCTION
            const componentRenderedVNode = instance.render(newVNode.props);
            
            this._currentInstance = null;

            this._reconcile(
              parentElement,
              componentRenderedVNode,
              instance.prevRenderedVNode,
              index,
              instanceKey
            );

            instance.prevRenderedVNode = componentRenderedVNode;
            return;
          }

          // 4. DOM Node
          // Debug if tag is weird
          if (typeof newVNode.tag !== "string") {
             console.error("Invalid Tag for DOM Node:", newVNode.tag, typeof newVNode.tag);
          }

          const domNode = parentElement.childNodes[index];
          const prevRenderedVNode = prevVNode;

          if (
            domNode &&
            prevRenderedVNode &&
            prevRenderedVNode.tag === newVNode.tag
          ) {
            this._updateDomProps(domNode, newVNode.props, prevRenderedVNode.props);
            const newChildren = newVNode.children;
            const oldChildren = prevRenderedVNode.children || [];
            const maxLength = Math.max(newChildren.length, oldChildren.length);

            for (let i = 0; i < maxLength; i++) {
              this._reconcile(
                domNode,
                newChildren[i],
                oldChildren[i],
                i,
                `${instanceKey}.${i}`
              );
            }
          } else {
            const newDomNode = this._createDomNode(newVNode);
            if (
              typeof newVNode === "object" &&
              newVNode !== null &&
              newVNode.children
            ) {
              newVNode.children.forEach((child, i) => {
                this._reconcile(newDomNode, child, null, i, `${instanceKey}.${i}`);
              });
            }

            if (domNode) {
              parentElement.replaceChild(newDomNode, domNode);
            } else {
              parentElement.appendChild(newDomNode);
            }
          }
        },
      };

      // Hooks
      function watch(callback, depsGetter) {
        const instance = AEUI._currentInstance;
        if (instance) {
          const initialDeps =
            typeof depsGetter === "function" ? depsGetter() : depsGetter;
          instance.watchStates.push({
            callback,
            getDeps:
              typeof depsGetter === "function" ? depsGetter : () => depsGetter,
            oldDeps: initialDeps,
          });
        }
      }

      function clean(callback) {
        const instance = AEUI._currentInstance;
        if (!instance) return;
        instance.cleanups.push(callback);
      }
    </script>

    <!-- User Code Template (Not executed directly) -->
    <script id="user-code" type="text/aeui-code">
      /** @jsx AEUI.createVNode */

      const CartItem = ({ item, onIncrease, onDecrease }) => {
        console.log(`[CartItem:${item.id}] Setup`);

        // Watch for quantity changes
        watch(() => {
           console.log(`[CartItem:${item.id}] Quantity changed to: ${item.quantity}`);
        }, [item.quantity]);

        // Render
        return (
            <li style="margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; display: flex; align-items: center;">
              <span style="margin-right: 10px;">
                {item.name} ({item.price}원)
              </span>
              <button onClick={() => onDecrease(item.id)}>-</button>
              <span style="margin: 0 10px; font-weight: bold;">{item.quantity}</span>
              <button onClick={() => onIncrease(item.id)}>+</button>
            </li>
        );
      };

      const ShoppingCart = () => {
        // State
        const items = [
          { id: 1, name: "사과", price: 1000, quantity: 1 },
          { id: 2, name: "바나나", price: 2000, quantity: 2 },
          { id: 3, name: "체리", price: 3000, quantity: 5 },
        ];

        // Actions (Mutations)
        const increase = (id) => {
          const item = items.find((i) => i.id === id);
          if (item) item.quantity++;
        };

        const decrease = (id) => {
          const item = items.find((i) => i.id === id);
          if (item && item.quantity > 0) item.quantity--;
        };

        // Computed
        const getTotal = () =>
          items.reduce((sum, item) => sum + item.price * item.quantity, 0);

        // Watch
        watch(() => {
          console.log(`[ShoppingCart] Total Price: ${getTotal()}원`);
        }, [getTotal()]);

        return (
          <div style="padding: 20px; font-family: sans-serif;">
            <h1>장바구니 (AEUI Framework)</h1>
            <ul style="list-style: none; padding: 0;">
              {items.map((item) => (
                <CartItem
                  key={item.id}
                  item={item}
                  onIncrease={increase}
                  onDecrease={decrease}
                />
              ))}
            </ul>
            <hr />
            <h3>총 합계: {getTotal()}원</h3>
            {getTotal() >= 20000 && (
              <p style="color: green; font-weight: bold;">
                🎉 무료 배송 대상입니다!
              </p>
            )}
          </div>
        );
      };

      const App = () => {
        return (
          <div>
            <ShoppingCart />
          </div>
        );
      };

      const root = document.getElementById("root");
      AEUI.init(App, root);
    </script>

    <!-- Manual Compilation & Execution -->
    <script>
      // Register Plugin
      if (window.Babel) {
          Babel.registerPlugin("aeui-transform", ({ types: t }) => {
            return {
              visitor: {
                CallExpression(path) {
                  // 1. Watch Dependencies: watch(fn, []) -> watch(fn, () => [])
                  if (t.isIdentifier(path.node.callee, { name: "watch" })) {
                    const args = path.node.arguments;
                    if (args.length >= 2 && t.isArrayExpression(args[1])) {
                       args[1] = t.arrowFunctionExpression([], args[1]);
                    }
                  }
                },
                ArrowFunctionExpression(path) {
                  // 0. Safety Check: Only transform components (assigned to variables/props), not callbacks (like map).
                  // We assume components are defined as const Comp = ... or obj.Comp = ...
                  if (
                    !t.isVariableDeclarator(path.parent) &&
                    !t.isAssignmentExpression(path.parent) &&
                    !t.isObjectProperty(path.parent)
                  ) {
                    return;
                  }

                  // 1. Component Return: return (JSX) -> return () => (JSX)
                  // We do this for ALL arrow functions that return JSX, regardless of params.
                  if (t.isBlockStatement(path.node.body)) {
                     const returnStmt = path.node.body.body.find(node => t.isReturnStatement(node));
                     
                     if (returnStmt) {
                         // Check if returning JSX directly (or parenthesized JSX)
                         let isJSX = t.isJSXElement(returnStmt.argument) || t.isJSXFragment(returnStmt.argument);
                         if (!isJSX && t.isParenthesizedExpression(returnStmt.argument)) {
                             isJSX = t.isJSXElement(returnStmt.argument.expression) || t.isJSXFragment(returnStmt.argument.expression);
                         }

                         if (isJSX) {
                             returnStmt.argument = t.arrowFunctionExpression([], returnStmt.argument);
                         }
                     }
                  }

                  // 2. Props Destructuring & Updates
                  const params = path.node.params;
                  if (params.length === 0) return;
                  if (!t.isObjectPattern(params[0])) return;

                  const propsParam = params[0];
                  const newParamName = path.scope.generateUidIdentifier("props");
                  path.node.params = [newParamName];

                  const destructuringDecl = t.variableDeclaration("let", [
                    t.variableDeclarator(propsParam, newParamName)
                  ]);
                  
                  if (t.isBlockStatement(path.node.body)) {
                     path.node.body.body.unshift(destructuringDecl);
                     
                     const returnStmt = path.node.body.body.find(node => t.isReturnStatement(node));
                     
                     if (returnStmt) {
                         // Now apply the prop update logic if it's a function (which it is now if it was JSX)
                         if (t.isArrowFunctionExpression(returnStmt.argument) || t.isFunctionExpression(returnStmt.argument)) {
                             const renderFn = returnStmt.argument;
                             const newPropsParam = path.scope.generateUidIdentifier("newProps");
                             
                             renderFn.params = [newPropsParam];
                             
                             const updateLogic = t.ifStatement(
                                 newPropsParam,
                                 t.expressionStatement(
                                     t.assignmentExpression(
                                         "=",
                                         propsParam, 
                                         newPropsParam
                                     )
                                 )
                             );
                             
                             if (t.isBlockStatement(renderFn.body)) {
                                 renderFn.body.body.unshift(updateLogic);
                             } else {
                                 renderFn.body = t.blockStatement([
                                     updateLogic,
                                     t.returnStatement(renderFn.body)
                                 ]);
                             }
                         }
                     }
                  }
                }
              }
            };
          });

          // Compile and Run
          try {
            const userCode = document.getElementById("user-code").textContent;
            const output = Babel.transform(userCode, {
              presets: ["react"],
              plugins: ["aeui-transform"]
            }).code;

            console.log("Compiled Code:", output);
            
            // Execute
            eval(output);
          } catch (e) {
            console.error("Compilation/Execution Error:", e);
            document.body.innerHTML += `<pre style="color:red">${e.message}</pre>`;
          }
      } else {
          console.error("Babel not loaded");
      }
    </script>
  </body>
</html>
