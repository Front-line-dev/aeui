<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>My Framework</title>
  </head>
  <body>
    <div id="root"></div>

    <script>
      console.log("AEUI Script Started");
      const AEUI = {
        _containerElement: null,
        _RootComponent: null,
        _previousVNode: null,
        _componentInstanceMap: new Map(),
        _currentInstance: null,
        _isRendering: false,

        createInstance(instanceKey, newVNode) {
          const instance = {
            key: instanceKey,
            vnode: newVNode,
            render: null, // The render function returned by the component
            prevRenderedVNode: null,
            watchIndex: 0,
            watchStates: [], // Stores dependencies for each watch
            cleanups: [], // Stores cleanup functions
          };
          this._componentInstanceMap.set(instanceKey, instance);
          
          // Set current instance for hooks to work during initial render
          this._currentInstance = instance;
          
          // Execute component function once to get the render function
          const renderFn = newVNode.tag(newVNode.props);
          
          if (typeof renderFn !== 'function') {
             throw new Error("Component must return a render function");
          }
          
          instance.render = renderFn;
          this._currentInstance = null;

          return instance;
        },

        createVNode(tag, props, ...children) {
          return { tag, props: props || {}, children: children.flat().filter(c => c != null) };
        },

        // --- Hooks ---

        watch(callback, dependencies) {
          const instance = this._currentInstance;
          if (!instance) return;

          const index = instance.watchIndex++;
          const oldDependencies = instance.watchStates[index];

          let hasChanged = true;
          if (oldDependencies) {
            hasChanged = dependencies.some((dep, i) => dep !== oldDependencies[i]);
          }

          if (hasChanged) {
            instance.watchStates[index] = dependencies;
            callback();
          }
        },

        clean(callback) {
          const instance = this._currentInstance;
          if (!instance) return;
          instance.cleanups.push(callback);
        },

        // --- Reconciliation ---

        _createDomNode(vnode) {
          if (vnode.tag === undefined) {
            return document.createTextNode(String(vnode));
          }
          const domNode = document.createElement(vnode.tag);
          this._updateDomProps(domNode, vnode.props);
          return domNode;
        },

        _updateDomProps(domNode, props, oldProps = {}) {
          // Remove old props
          Object.keys(oldProps).forEach(name => {
            if (!(name in props)) {
              if (name.startsWith("on")) {
                const eventName = name.slice(2).toLowerCase();
                domNode.removeEventListener(eventName, oldProps[name]);
              } else {
                domNode.removeAttribute(name);
              }
            }
          });

          // Set new props
          Object.entries(props).forEach(([name, value]) => {
            if (oldProps[name] === value) return;

            if (name.startsWith("on")) {
              const eventName = name.slice(2).toLowerCase();
              if (oldProps[name]) {
                domNode.removeEventListener(eventName, oldProps[name]);
              }
              domNode.addEventListener(eventName, value);
            } else if (name === "style") {
               domNode.style.cssText = value;
            } else if (name === "value" && ["INPUT", "TEXTAREA", "SELECT"].includes(domNode.tagName)) {
               domNode.value = value;
            } else {
              domNode.setAttribute(name, value);
            }
          });
        },

        _unmount(instanceKey) {
           for (const [key, instance] of this._componentInstanceMap) {
               if (key.startsWith(instanceKey)) {
                   instance.cleanups.forEach(cleanup => cleanup());
                   this._componentInstanceMap.delete(key);
               }
           }
        },

        _reconcile(parentElement, newVNode, prevVNode, index = 0, instanceKey = "root") {
          // 1. Remove node
          if (newVNode == null) {
            if (prevVNode) {
                this._unmount(instanceKey);
                if (parentElement.childNodes[index]) {
                    parentElement.removeChild(parentElement.childNodes[index]);
                }
            }
            return;
          }

          // 2. Text Node (Primitive)
          if (typeof newVNode !== 'object') {
             const domNode = parentElement.childNodes[index];
             if (domNode && domNode.nodeType === Node.TEXT_NODE) {
                 if (domNode.nodeValue !== String(newVNode)) {
                     domNode.nodeValue = String(newVNode);
                 }
             } else {
                 const newDomNode = document.createTextNode(String(newVNode));
                 if (domNode) {
                     parentElement.replaceChild(newDomNode, domNode);
                 } else {
                     parentElement.appendChild(newDomNode);
                 }
             }
             return;
          }

          // 2. Component Node
          if (typeof newVNode.tag === "function") {
            let instance = this._componentInstanceMap.get(instanceKey);

            // If component type changed, unmount old and create new
            if (instance && prevVNode?.tag !== newVNode.tag) {
                this._unmount(instanceKey);
                instance = null;
            }

            if (!instance) {
              instance = this.createInstance(instanceKey, newVNode);
            } else {
                // Update vnode for next render
                instance.vnode = newVNode;
            }

            // Render component
            this._currentInstance = instance;
            instance.watchIndex = 0; 
            
            const componentRenderedVNode = instance.render();
            this._currentInstance = null;

            this._reconcile(
              parentElement,
              componentRenderedVNode,
              instance.prevRenderedVNode,
              index,
              instanceKey
            );

            instance.prevRenderedVNode = componentRenderedVNode;
            return;
          }

          // 3. DOM Node
          // Reuse existing node if tag matches
          const domNode = parentElement.childNodes[index];
          const prevRenderedVNode = prevVNode; // For DOM nodes, prevVNode is the vnode itself

          if (domNode && prevRenderedVNode && prevRenderedVNode.tag === newVNode.tag) {
             // Update props
             this._updateDomProps(domNode, newVNode.props, prevRenderedVNode.props);
             // Update children
             const newChildren = newVNode.children;
             const oldChildren = prevRenderedVNode.children || [];
             const maxLength = Math.max(newChildren.length, oldChildren.length);
             
             for (let i = 0; i < maxLength; i++) {
                this._reconcile(
                  domNode,
                  newChildren[i],
                  oldChildren[i],
                  i,
                  `${instanceKey}.${i}`
                );
             }
          } else {
             // Replace or Append
             const newDomNode = this._createDomNode(newVNode);
             // Render children
             newVNode.children.forEach((child, i) => {
                this._reconcile(newDomNode, child, null, i, `${instanceKey}.${i}`);
             });

             if (domNode) {
                parentElement.replaceChild(newDomNode, domNode);
             } else {
                parentElement.appendChild(newDomNode);
             }
          }
        },

        init(RootComponent, containerElement) {
          this._containerElement = containerElement;
          this._RootComponent = RootComponent;
          
          // Initial Render
          this._tick();
          
          // Start Loop
          setInterval(() => {
            this._tick();
          }, 1000);
        },

        _tick() {
          if (this._isRendering) return;
          this._isRendering = true;

          this._componentInstanceMap.forEach(instance => {
             instance.watchStates.forEach(watcher => {
                 const newDeps = watcher.getDeps();
                 const hasChanged = !watcher.oldDeps || newDeps.some((d, i) => d !== watcher.oldDeps[i]);
                 if (hasChanged) {
                     watcher.callback();
                     watcher.oldDeps = newDeps;
                 }
             });
          });

          const newVNode = this.createVNode(this._RootComponent);
          this._reconcile(
            this._containerElement,
            newVNode,
            this._previousVNode
          );
          this._previousVNode = newVNode;
          
          this._isRendering = false;
        }
      };

      // --- User Code ---
      
      const { createVNode } = AEUI;
      
      // Modified watch to accept dependency getter to work with "setup once" pattern
      function watch(callback, depsGetter) {
         const instance = AEUI._currentInstance;
         if (instance) {
             // Initial check
             const initialDeps = typeof depsGetter === 'function' ? depsGetter() : depsGetter;
             instance.watchStates.push({
                 callback,
                 getDeps: typeof depsGetter === 'function' ? depsGetter : () => depsGetter,
                 oldDeps: initialDeps
             });
         }
      }
      
      function clean(callback) {
          AEUI.clean(callback);
      }

      const Counter = () => {
        let count = 0;
        const increment = () => count++;

        // Using a getter for dependencies so they can be re-evaluated
        watch(() => {
          console.log(`[Counter] count 변화: ${count}`);
        }, () => [count]);
        
        clean(() => {
            console.log("[Counter] Clean up!");
        });

        return () => {
          return createVNode(
            "div",
            {
              style: "border: 1px solid blue; padding: 10px; margin-top: 10px;",
            },
            createVNode("h2", null, "Count: ", count),
            createVNode("button", { onClick: increment }, "Click to increase")
          );
        };
      };

      const App = () => {
        let showCounter = true;
        const toggle = () => showCounter = !showCounter;

        return () => {
          return createVNode(
            "div",
            null,
            createVNode("h1", null, "AEUI Framework"),
            createVNode("button", { onClick: toggle }, "Toggle Counter"),
            showCounter ? createVNode(Counter) : null
          );
        };
      };

      const root = document.getElementById("root");
      AEUI.init(App, root);
    </script>
  </body>
</html>
